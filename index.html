<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <button command="show-modal" commandfor="my-dialog" class="new-book">New Book</button>
        <dialog id="my-dialog">
            <p>Add a new book.</p>

            <form>
                <div>
                    <label for="title">Title:</label>
                    <input type="text" name="title" id="title" required>
                </div>
                
                <div>
                    <label for="author">Author:</label>
                    <input type="text" name="author" id="author" required>
                </div>

                <div>
                    <label for="pages">Pages:</label>
                    <input type="number" name="pages" id="pages" required>
                </div>

                <div>
                    <p>Read:</p>

                    <label for="read-yes">Yes</label>
                    <input type="radio" name="read" id="read-yes" value="yes">
                    
                    <label for="read-no">No</label>
                    <input type="radio" name="read" id="read-no" value="no">
                </div>

                <button type="submit" class="add-book">Add</button>
            </form>

            <button commandfor="my-dialog" command="close" class="close-btn">Close</button>
        </dialog>
        
        <h1>Your books</h1>
        <div class="books-container"></div>
        
    </main>
    
    <script src="script.js"></script>
</body>
</html>
